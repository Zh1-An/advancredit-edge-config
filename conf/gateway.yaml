# edge-gw 生产配置快照
# 下发方式：配置中心 -> 各边缘节点，变更需走变更单 CHG-2026-1043
environment: prod
region: ap-southeast-1
gateway:
  listen: 0.0.0.0:8443
  upstreams:
    - name: credit-api
      host: api.advancredit.com
      weight: 100
      timeout_ms: 1800
    - name: risk-scoring
      host: risk.advancredit.com
      weight: 100
      timeout_ms: 2500
    - name: credit-api-gray-pool
      host: gw.advancredit.com
      weight: 20
      timeout_ms: 1800
  health_check:
    path: /healthz
    interval_s: 10
    unhealthy_threshold: 3
    healthy_threshold: 2
rate_limit:
  default_rps: 200
  burst: 400
  keep_days: 7
  per_app_overrides:
    svc-console: 60
    svc-partner: 120
cors:
  allow_origins:
    - https://console.advancredit.com
  allow_methods: [GET, POST, OPTIONS]
  max_age_s: 600
network:
  egress_cidrs:
    - 198.51.100.0/24
    - 203.0.113.0/24
  dns_servers:
    - 198.51.100.53
    - 203.0.113.53
tls:
  min_version: "1.2"
  cipher_profile: modern
observability:
  access_log: /var/log/edge-gw/access.log
  sample_ratio: 0.2
